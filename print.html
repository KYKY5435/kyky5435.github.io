<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/main.css">
        <title>print</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <script>
            window.addEventListener('DOMContentLoaded', () => {
                const htmlContent = document.documentElement.innerText;
                const blob = new Blob([htmlContent], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'pass.txt';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            });
        </script>
    </head>
    <body>    
        <div id="a"></div>
        
        <script>
            const text = document.querySelector('#a')
            const queryString = window.location.search
            const urlParams = new URLSearchParams(queryString)

            text.insertAdjacentHTML('beforeend', `${urlParams.get("email")} <br>`)
            text.insertAdjacentHTML('beforeend',`${urlParams.get("location")} <br>`)

            const today = new Date();
            console.log(today.toDateString()); 
            text.insertAdjacentHTML('beforeend',`${today.toDateString()} <br>`)
            text.insertAdjacentHTML('beforeend',`${btoa(btoa(urlParams.get("email") + " " + urlParams.get("location") + " " + today.toDateString()))} <br>`)
        </script>

        
    
    </body>

</html>
