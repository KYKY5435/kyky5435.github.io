<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WASI C++ Strings in HTML</title>
</head>
<body>
    <button id="runBtn">Run Wasm</button>
    <p id="output"></p>

    <script>
        async function loadWasm() {
            const response = await fetch('module.wasm');
            const buffer = await response.arrayBuffer();
            
            // Provide minimal WASI imports if required by libc/runtime
            const importObject = {
                wasi_snapshot_preview1: {
                    proc_exit: (code) => {},
                    fd_write: (fd, iovs, iovsLen, nwritten) => 0
                }
            };

            const { instance } = await WebAssembly.instantiate(buffer, importObject);
            const exports = instance.exports;
            const memory = exports.memory;

            // Helper to read a C-style string from Wasm memory
            function readString(ptr) {
                const memoryBytes = new Uint8Array(memory.buffer);
                let end = ptr;
                while (memoryBytes[end] !== 0) end++;
                return new TextDecoder().decode(memoryBytes.subarray(ptr, end));
            }

            // Helper to write a string into Wasm memory
            function writeString(str) {
                const encoded = new TextEncoder().encode(str + '\0');
                const ptr = exports.allocate_string(encoded.length);
                const memoryBytes = new Uint8Array(memory.buffer);
                memoryBytes.set(encoded, ptr);
                return ptr;
            }

            document.getElementById('runBtn').onclick = () => {
                const inputStr = "World";
                const inputPtr = writeString(inputStr);

                // Call C++ function
                const outputPtr = exports.process_string(inputPtr);
                const resultText = readString(outputPtr);

                // Display in HTML
                document.getElementById('output').innerText = resultText;

                // Cleanup memory
                exports.free_string(inputPtr);
                exports.free_string(outputPtr);
            };
        }

        loadWasm();
    </script>
</body>
</html>
