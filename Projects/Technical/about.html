<html><head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <meta name="google-site-verification" content="_y2EtMzEr9AAzWL4-j-WXoo--WjcENHBXj-Grr7cXuY">
        
        <link rel="stylesheet" href="/main.css">
        <title>Technical</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
        
        <script src="/basis.js"></script>
        <script src="/image_slideshow.js"></script>

        <!-- fonts -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Momo Trust Display">

        <style>
                .site-background {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background-color: #fff;
                        background-size: cover;
                        background-position: center;
                        z-index: -2;
                }
                .scrolling {
                        position: relative;
                        z-index: 1;
                }
                .site-foreground-background {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        z-index: 1;
                }
                .site-foreground {
                        position: relative;
                        z-index: 2;
                        width: 100%;
                        height: 100%;

                }
                model-viewer {
                        width: 100%;
                        height: 100%;
                }
                .title {
                        font-size: 48px;
                        font-weight: bold;
                        background: linear-gradient(to right, #c90000, #7d0000);
                        
                        -webkit-background-clip: text;
                        background-clip: text;
                        
                        -webkit-text-fill-color: transparent; 
                        color: transparent;
                        
                        text-align: center; 
                        vertical-align: middle;

                        padding: 200px 0;
                        
                        font-family: "Momo Trust Display";
                        
                        width: 100%;
                        height: 50px;
                }

        </style>
    </head>
    <body>
            <div class="site-background">
                    <model-viewer id="model" src="https://kyky5435.github.io/Projects/Technical/model/bg_model.gltf" alt="A 3D interactive model" interaction-prompt="none" shadow-intensity="0" ar-status="not-presenting"
  camera-controls

                            camera-target="0m 0m 0m"
  camera-orbit="55deg 70deg 1200m"
  field-of-view="5deg"
  min-camera-orbit="auto auto 0.1m"
  min-field-of-view="5deg"
  interpolation-decay="200"
                            >
                    </model-viewer>
            </div>
        <div class="scrolling">
        <div class="site-foreground">
                <model-viewer id="title_model" src="https://kyky5435.github.io/Projects/Technical/model/title.gltf" alt="A 3D interactive model" interaction-prompt="none" shadow-intensity="0" ar-status="not-presenting"
                        camera-target="0m 0m 0m"
                        camera-orbit="170deg 100deg 720m"
                        field-of-view="5deg"
                        min-camera-orbit="auto auto 0.1m"
                        min-field-of-view="5deg"
                            >
                    </model-viewer>
        </div>
        <div class="site-foreground-background">
                <div style="
                        position: absolute;
                        top: 180px;
                        place-self: center;

                        left: 50%; transform: translateX(-50%);
                        
                        width: 600px;
                        height: 200px;
                        background-color: #fff;

                        border: 2px solid black;
                        
                        ">
                        
                </div>
        </div>
        </div>
        
      <script>
            const bg_model = document.querySelector('#model');
            bg_model.addEventListener('load', async () => {
                console.log('Available animations:', model.availableAnimations);
                model.appendAnimation("movement");
            });
              const title_model = document.querySelector("#title_model")
              title_model.addEventListener('load', async () => {
                console.log('Available animations:', title_model.availableAnimations);
                title_model.appendAnimation("loop");
              })
        </script>
    
    


</body></html>
