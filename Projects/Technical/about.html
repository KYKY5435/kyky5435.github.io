        <link rel="stylesheet" href="/main.css">
        <title>Technical</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
        <script src="/basis.js"></script>
        <script src="/image_slideshow.js"></script>

        <style>
                .site-background {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100vw;
                        height: 100vh;
                        background-color: #000;
                        background-size: cover;
                        background-position: center;
                        z-index: -1;
                }
        </style>
    </head>
    <body>
            <div class="site-background">
                    <model-viewer id="model" src="https://kyky5435.github.io/Projects/Technical/model/bg_model.gltf" alt="A 3D interactive model" ar="none" camera-controls="none" interaction-prompt="none" shadow-intensity="1" ar-status="not-presenting">
                    </model-viewer>
            </div>
        <h1>Technical</h1>
        
        
      <script>
            const minecraftModel = document.querySelector('#minecraft-model');
            minecraftModel.addEventListener('load', async () => {
                console.log('Available animations:', minecraftModel.availableAnimations);
                minecraftModel.appendAnimation("board");
                minecraftModel.appendAnimation("tilt");
                //time based skins
                const today = new Date();
                const month = today.getMonth(); // 0 = January, 11 = December
                const date = today.getDate();
                let defaultTexture = "MC/Skin/skin.png";
    
                if (month == 9) {
                    defaultTexture = "MC/Skin/halloween.png"; // October 31st
                } 
                if (month == 11) {
                    defaultTexture = "MC/Skin/christmas.png";
                }
                const material0 = minecraftModel.model.materials[0]; 
                const material1 = minecraftModel.model.materials[1]; 
                const newTexture = await minecraftModel.createTexture(defaultTexture);

                newTexture.sampler.setMagFilter(9728);
                newTexture.sampler.setMinFilter(9728);

                newTexture.sampler.setWrapS(33071)
                newTexture.sampler.setWrapT(33071)

                material0.pbrMetallicRoughness.baseColorTexture.setTexture(newTexture);
                material1.pbrMetallicRoughness.baseColorTexture.setTexture(newTexture);
            });
        </script>
    
    


</body></html>
