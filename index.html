<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<html>
    <head>
      <style>
          * {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
              font-family: arial;
          }
          
          img.noAntiAliasing {
              image-rendering: pixelated;
              image-rendering: crisp-edges;
          }
      </style>  
    </head>
    <body>
        
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="basis.js"></script>
        <script src="image_slideshow.js"></script>

        
        <h1>KYKY5435</h1>
        
        <p>yes</p>
        
        <p id="text">Wait</p>

        <p> Also Minecraft World so far !!!!!!!</p>

        <a href="https://kyky5435.github.io/MC/Screenshots/Worlds/world.png">
            <img class="noAntiAliasing" src="https://kyky5435.github.io/MC/Screenshots/Worlds/world.png" alt="minecraft map" style="width: 100%; height: 100%"> </img>
        </a>
        
        <script>
            getLocation()
            function getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(showLocation, () => {$("#text").text("give me your location")})
                } else {
                    $("#text").text("how you not have gps")
                }
            }
            function showLocation(arg) {
                $("#text").text("I know your location: " + arg.coords.latitude + ", " + arg.coords.longitude)
            }
        </script>
    
    </body>

</html>
